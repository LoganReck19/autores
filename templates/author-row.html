<tr><td>{{ author.id }}</td><td>{{ author.name }}</td><td>{{ author.country }}</td><td>{{ author.books|length }}</td><td class="text-end"><button class="btn btn-sm btn-outline-primary" hx-get="/autores/{{ author.id }}/libros" hx-target="closest tr" hx-swap="outerHTML">Libros</button> <button class="btn btn-sm btn-outline-secondary" hx-get="/autores/{{ author.id }}/editar" hx-target="closest tr" hx-swap="outerHTML">Editar</button> <button class="btn btn-sm btn-outline-danger" hx-delete="/autores/{{ author.id }}" hx-target="#tabla-autores" hx-swap="outerHTML" hx-confirm="¿Borrar este autor?">Borrar</button></td></tr>
