<div class="card" id="tabla-libros"><div class="card-body"><h5 class="card-title">Lista de libros</h5><table class="table table-striped align-middle"><thead><tr><th>ID</th><th>Título</th><th>Autor</th><th>Año</th><th>Género</th></tr></thead><tbody>{% for book in books %}<tr><td>{{ book.id }}</td><td>{{ book.title }}</td><td>{{ book.author.name }}</td><td>{{ book.year }}</td><td>{{ book.genre }}</td></tr>{% endfor %}</tbody></table></div></div>
