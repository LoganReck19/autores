<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/htmx.org@2.0.10"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"><div class="container-fluid"><a class="navbar-brand" href="/">Biblioteca</a><ul class="navbar-nav"><li class="nav-item"><a class="nav-link active" href="/">Inicio</a></li><li class="nav-item"><a class="nav-link" href="/autores">Autores</a></li><li class="nav-item"><a class="nav-link" href="/libros">Libros</a></li></ul></div></nav>
    <div id="contenido">
      <div class="p-5 mb-4 bg-white border rounded-3"><div class="container-fluid py-3"><h1 class="display-5 fw-bold">Bienvenido a la biblioteca</h1><p class="col-md-8 fs-5">Explora nuestra colección de libros y conoce a los autores que les dieron vida.</p><button class="btn btn-primary btn-lg" hx-get="/libros" hx-target="#coleccion" hx-swap="innerHTML">Ver libros</button></div></div>
      <div class="row g-3 mb-4"><div class="col-md-6"><div class="card"><div class="card-body"><h5 class="card-title">Libros disponibles</h5><p class="display-6 mb-0">{{ book_count }}</p></div></div></div><div class="col-md-6"><div class="card"><div class="card-body"><h5 class="card-title">Autores registrados</h5><p class="display-6 mb-0">{{ author_count }}</p></div></div></div></div>
      <div id="coleccion"></div>
    </div>
  </div>
</body>
</html>
