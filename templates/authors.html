<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.10"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"><div class="container-fluid"><a class="navbar-brand" href="/">Biblioteca</a><ul class="navbar-nav"><li class="nav-item"><a class="nav-link" href="/">Inicio</a></li><li class="nav-item"><a class="nav-link active" href="/autores">Autores</a></li><li class="nav-item"><a class="nav-link" href="/libros">Libros</a></li></ul></div></nav>
    <div id="contenido">
      <h1 class="mb-4">Autores</h1>
      <div class="card mb-4"><div class="card-body"><h5 class="card-title">Crear autor</h5><form class="row g-3" hx-post="/autores" hx-target="#tabla-autores" hx-swap="outerHTML"><div class="col-md-5"><label for="nombre" class="form-label">Nombre</label><input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre del autor" disabled></div><div class="col-md-5"><label for="pais" class="form-label">País</label><input type="text" class="form-control" id="pais" name="pais" placeholder="País" disabled></div><div class="col-md-2 d-flex align-items-end"><button type="submit" class="btn btn-primary w-100" disabled>Crear</button></div></form><small class="text-muted d-block mt-2">Los autores se cargan desde la base de datos.</small></div></div>
      <div class="card" id="tabla-autores"><div class="card-body"><h5 class="card-title">Lista de autores</h5><table class="table table-striped align-middle"><thead><tr><th>ID</th><th>Nombre</th><th>País</th><th>Libros</th><th class="text-end">Acciones</th></tr></thead><tbody>{% for author in authors %}<tr><td>{{ author.id }}</td><td>{{ author.name }}</td><td>{{ author.country }}</td><td>{{ author.books|length }}</td><td class="text-end"><button class="btn btn-sm btn-outline-primary" hx-get="/autores/{{ author.id }}/libros" hx-target="closest tr" hx-swap="outerHTML">Libros</button></td></tr>{% endfor %}</tbody></table></div></div>
    </div>
  </div>
</body>
</html>
