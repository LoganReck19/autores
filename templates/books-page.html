<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.10"></script>
</head>
<body class="bg-light"><div class="container py-4">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"><div class="container-fluid"><a class="navbar-brand" href="/">Biblioteca</a><ul class="navbar-nav"><li class="nav-item"><a class="nav-link" href="/">Inicio</a></li><li class="nav-item"><a class="nav-link" href="/autores">Autores</a></li><li class="nav-item"><a class="nav-link active" href="/libros">Libros</a></li></ul></div></nav>
  <div id="contenido"><h1 class="mb-4">Libros</h1>
    <!-- El selector usa autores reales de la base de datos. -->
    <div class="card mb-4"><div class="card-body"><h5 class="card-title">Crear libro</h5>
      <form class="row g-3" hx-post="/libros" hx-target="#tabla-libros" hx-swap="outerHTML">
        <div class="col-md-4"><label for="titulo" class="form-label">Título</label><input type="text" class="form-control" id="titulo" name="titulo" placeholder="Título del libro" required></div>
        <div class="col-md-3"><label for="autor_id" class="form-label">Autor</label><select class="form-select" id="autor_id" name="autor_id" required><option value="">Selecciona un autor</option>{% for author in authors %}<option value="{{ author.id }}">{{ author.name }}</option>{% endfor %}</select></div>
        <div class="col-md-2"><label for="anio" class="form-label">Año</label><input type="number" class="form-control" id="anio" name="anio" placeholder="Año" required></div>
        <div class="col-md-2"><label for="genero" class="form-label">Género</label><input type="text" class="form-control" id="genero" name="genero" placeholder="Género" required></div>
        <div class="col-md-1 d-flex align-items-end"><button type="submit" class="btn btn-primary w-100">Crear</button></div>
      </form>
    </div></div>
    {% include "books.html" %}
  </div>
</div></body></html>
